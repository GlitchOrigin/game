<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLITCH WORLD - TELEGRAM EDITION</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>

<body>

<h1 id="title">SYSTEM DESTRUCTION</h1>
<button id="btn">DO NOT TOUCH</button>
<div id="score">CHAOS: 0</div>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
    tg.expand();
    tg.ready();
}

// --- GAME STATE ---
let score = 0;
let isPunishing = false;

const btn = document.getElementById("btn");
const scoreEl = document.getElementById("score");
const titleEl = document.getElementById("title");

// --- ADSGRAM INIT ---
let AdController = null;

window.addEventListener("load", () => {
    try {
        if (!window.Adsgram) return;

        AdController = window.Adsgram.init({
            blockId: "34799", // ⚠️ твой Reward/Interstitial Unit ID
            debug: true
        });

        console.log("AdsGram initialized");
    } catch (e) {
        console.error("AdsGram init error:", e);
    }
});

// --- UPDATE SCORE ---
function updateUI() {
    scoreEl.innerText = "CHAOS: " + score;
}

// --- ADS FUNCTION (FIXED PROPERLY) ---
async function showAd() {
    if (isPunishing || !AdController) return;

    try {
        const result = await AdController.show();

        // 🔥 ГЛАВНОЕ ИСПРАВЛЕНИЕ
        if (result && result.done) {
            score += 1000;
            updateUI();

            if (tg?.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }

            titleEl.innerText = "BONUS +1000!";

            setTimeout(() => {
                titleEl.innerText = "SYSTEM DESTRUCTION";
            }, 2000);
        }

    } catch (err) {
        console.error("Ad failed:", err);

        if (tg?.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('warning');
        }
    }
}

// --- GAME CLICK ---
btn.addEventListener("pointerdown", () => {
    if (isPunishing) return;

    score += 1;
    updateUI();

    // иногда показываем рекламу
    if (Math.random() > 0.85) {
        showAd();
    }
});

// --- NAV BUTTON (если есть) ---
document.addEventListener("DOMContentLoaded", () => {
    const earn = document.getElementById("nav-earn");
    if (earn) {
        earn.addEventListener("click", showAd);
    }
});

updateUI();

</script>

</body>
</html>
