<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Telegram Validation</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        body{
            margin:0;
            padding:0;

            background:#000;
            color:#fff;

            font-family:Arial;

            height:100vh;

            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }

        h1{
            margin-bottom:40px;
        }

        button{

            padding:20px 40px;

            border:none;
            border-radius:12px;

            background:#00ff88;
            color:#000;

            font-size:20px;
            font-weight:bold;

            cursor:pointer;
        }

        #result{

            margin-top:40px;

            font-size:28px;
            font-weight:bold;

            text-align:center;
        }

        .good{
            color:#00ff88;
        }

        .bad{
            color:#ff4444;
        }

        .info{
            margin-top:20px;
            font-size:14px;
            color:#999;
            max-width:90%;
            word-break:break-word;
        }

    </style>
</head>

<body>

<h1>
    Telegram Validation
</h1>

<button id="checkBtn">
    CHECK VALIDATION
</button>

<div id="result">
    WAITING...
</div>

<div class="info" id="info"></div>

<script>

    const tg = window.Telegram.WebApp;

    tg.expand();

    const result =
        document.getElementById("result");

    const info =
        document.getElementById("info");

    document
        .getElementById("checkBtn")
        .onclick = async () => {

        result.innerHTML =
            "CHECKING...";

        info.innerHTML = "";

        try {

            const response = await fetch(

                "https://server-ieki.onrender.com/validate",

                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        initData: tg.initData

                    })
                }
            );

            const data =
                await response.json();

            console.log(data);

            if(data.valid){

                result.innerHTML =
                    '<span class="good">VALID ✅</span>';

            } else {

                result.innerHTML =
                    '<span class="bad">INVALID ❌</span>';

            }

            info.innerHTML =

                "<br><b>initData:</b><br><br>" +

                (tg.initData || "EMPTY");

        }

        catch(e){

            console.error(e);

            result.innerHTML =
                '<span class="bad">SERVER ERROR ❌</span>';

            info.innerHTML =
                e.toString();
        }
    };

</script>

</body>
</html>
