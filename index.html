<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Validation</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 30px;
            text-align: center;
        }

        button {
            background: #00ff88;
            border: none;
            color: black;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            text-align: left;
            white-space: pre-wrap;
            background: #111;
            padding: 20px;
            border-radius: 10px;
            overflow-wrap: break-word;
        }

        .success {
            color: #00ff88;
        }

        .error {
            color: #ff4444;
        }
    </style>
</head>
<body>

    <h1>Telegram Validation</h1>

    <button onclick="checkValidation()">
        CHECK VALIDATION
    </button>

    <div id="result"></div>

    <script>
        const tg = window.Telegram.WebApp;

        tg.expand();
        tg.ready();

        async function checkValidation() {

            const result = document.getElementById("result");

            result.innerHTML = "Checking...";

            try {

                const initData = tg.initData;

                const response = await fetch("https://server-ieki.onrender.com/validate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        initData: initData
                    })
                });

                const data = await response.json();

                console.log(data);

                if (data.valid) {

                    result.innerHTML = `
<div class="success">
<h2>VALID ✅</h2>

<p><b>Saved to Firebase:</b> YES</p>

<p><b>User ID:</b> ${data.user.id}</p>
<p><b>Username:</b> ${data.user.username}</p>
<p><b>First Name:</b> ${data.user.first_name}</p>
<p><b>Last Name:</b> ${data.user.last_name}</p>

<p><b>initData:</b></p>
${initData}
</div>
                    `;

                } else {

                    result.innerHTML = `
<div class="error">
<h2>INVALID ❌</h2>

${JSON.stringify(data, null, 2)}
</div>
                    `;
                }

            } catch (e) {

                result.innerHTML = `
<div class="error">
<h2>ERROR ❌</h2>

${e.message}
</div>
                `;

                console.error(e);
            }
        }
    </script>

</body>
</html>
