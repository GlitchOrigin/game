<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLITCH WORLD - TELEGRAM EDITION</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=JetBrains+Mono:wght@800&display=swap');

        :root {
            --glitch-color: #00ff00;
            --accent-color: #ff003c;
            /* Telegram Pure Black Theme */
            --bg-color: #000000;
            --main-font: 'Russo One', sans-serif;
            --mono-font: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: var(--main-font);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
            user-select: none; -webkit-user-select: none;
            transition: transform 0.1s;
        }

        /* CRT Scanlines */
        .crt::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 255, 0, 0.06));
            z-index: 1000; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }

        .noise-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/oEI9uWUznW3D2/giphy.gif');
            opacity: 0.05; pointer-events: none; z-index: 1;
        }

        #settings-icon {
            position: fixed; top: 20px; right: 20px; width: 35px; height: 35px;
            cursor: pointer; z-index: 1100; fill: white; filter: drop-shadow(0 0 5px var(--accent-color));
        }

        #settings-menu {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.98);
            padding: 40px; border: 2px solid var(--accent-color);
            z-index: 1200; transition: 0.2s; text-align: center;
            width: 90%; max-width: 400px;
            clip-path: polygon(0 5%, 100% 0, 100% 95%, 0 100%);
            box-shadow: 10px 10px 0 var(--glitch-color), -10px -10px 0 var(--accent-color);
        }
        #settings-menu.open { transform: translate(-50%, -50%) scale(1); animation: menu-glitch 0.3s infinite; }
        
        @keyframes menu-glitch {
            0% { clip-path: polygon(0 5%, 100% 0, 100% 95%, 0 100%); }
            50% { clip-path: polygon(5% 0, 95% 5%, 100% 100%, 0 90%); }
            100% { clip-path: polygon(0 5%, 100% 0, 100% 95%, 0 100%); }
        }

        .lang-btn {
            background: transparent; color: white; border: 2px solid white;
            padding: 15px; font-family: var(--main-font); margin: 10px 0;
            cursor: pointer; font-weight: 900; width: 100%; transition: 0.1s;
        }
        .lang-btn:hover { background: var(--accent-color); border-color: var(--glitch-color); transform: skew(-5deg); box-shadow: 5px 5px 0 var(--glitch-color); }

        .main-content { display: flex; flex-direction: column; align-items: center; z-index: 5; margin-top: -5vh; transition: filter 0.1s; }

        h1 {
            font-size: clamp(1.2rem, 8vw, 2.5rem); text-transform: uppercase;
            animation: text-vibrate 0.1s infinite; margin-bottom: 0.5rem;
            text-align: center;
        }
        @keyframes text-vibrate {
            0% { transform: translate(0); text-shadow: 2px 2px var(--accent-color), -2px -2px var(--glitch-color); }
            50% { transform: translate(1px, -1px); text-shadow: -2px -2px var(--accent-color), 2px 2px var(--glitch-color); }
            100% { transform: translate(0); }
        }

        .trash-btn-wrapper {
            position: relative; width: clamp(200px, 60vw, 280px); height: clamp(200px, 60vw, 280px);
            margin: 1rem 0;
        }
        #btn {
            position: absolute; width: 100%; height: 100%; background: var(--accent-color);
            border: none; color: white; font-family: var(--main-font); font-size: 1.3rem;
            font-weight: 900; cursor: pointer; clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%);
            box-shadow: 10px 10px 0 var(--glitch-color), -10px -10px 0 #003cff;
            animation: btn-insane 0.3s infinite;
        }
        
        #btn.glitch-active {
            background: #fff !important;
            color: #000 !important;
            animation: btn-glitch-warning 0.05s infinite !important;
            box-shadow: 0 0 50px #fff, 0 0 20px var(--accent-color);
        }

        @keyframes btn-glitch-warning {
            0% { transform: translate(5px, 0) skew(10deg); filter: contrast(200%) invert(0); }
            20% { transform: translate(-5px, 2px) skew(-10deg); filter: contrast(150%) invert(1); }
            40% { transform: translate(2px, -5px) scale(1.1); }
            60% { transform: translate(-2px, 5px) rotate(2deg); }
            80% { transform: translate(0, 0) scale(0.9); }
            100% { transform: translate(5px, 0); }
        }

        @keyframes btn-insane {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); background: var(--glitch-color); color: black; clip-path: polygon(0 0, 100% 15%, 100% 100%, 0 85%); }
            100% { transform: scale(1); }
        }

        #score-container { 
            display: flex; flex-direction: column; align-items: center; 
            margin-top: 1rem; width: 100%;
        }
        #score {
            font-size: clamp(1.2rem, 6vw, 2rem); font-family: var(--mono-font);
            color: var(--glitch-color); text-shadow: 0 0 10px var(--glitch-color);
            background: black; padding: 10px 20px; border: 2px solid white;
            z-index: 10; position: relative; overflow: hidden;
        }
        #score.erasing {
            animation: score-shake 0.1s infinite;
            color: #ff0000;
            border-color: #ff0000;
        }
        @keyframes score-shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(0, 0); }
        }

        #combo {
            font-size: 1.2rem; color: var(--accent-color); font-weight: 900;
            margin-top: 15px;
            opacity: 0; transition: transform 0.1s ease-out, opacity 0.2s;
            text-shadow: 2px 2px 0 black;
            pointer-events: none;
        }

        .nav-bar {
            position: fixed; bottom: 25px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: clamp(10px, 4vw, 20px); z-index: 100;
        }
        .nav-item {
            font-family: var(--main-font); font-size: clamp(0.7rem, 3vw, 0.9rem);
            color: white; text-transform: uppercase; cursor: pointer; position: relative;
        }

        .data-block { position: absolute; background: var(--glitch-color); width: 40px; height: 10px; opacity: 0.6; pointer-events: none; z-index: 2; }
        .hit-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; pointer-events: none; z-index: 2000; opacity: 0; }
        .flash { animation: flash-anim 0.1s; }
        @keyframes flash-anim { 0% { opacity: 0.6; } 100% { opacity: 0; } }

        /* ИНТЕНСИВНЫЙ ГЛИТЧ ПРИ НАКАЗАНИИ */
        .punishment-active {
            animation: screen-chaos 0.1s infinite !important;
            filter: hue-rotate(90deg) contrast(300%) !important;
        }

        @keyframes screen-chaos {
            0% { transform: translate(10px, 10px) rotate(5deg) scale(1.2); clip-path: inset(10% 0 40% 0); }
            20% { transform: translate(-10px, -20px) rotate(-5deg) scale(0.8); clip-path: inset(30% 0 20% 0); }
            40% { transform: translate(20px, 5px) skew(20deg) scale(1.5); filter: invert(1); }
            60% { transform: translate(-20px, 15px) rotate(180deg) scale(0.5); clip-path: inset(0 20% 0 30%); }
            80% { transform: translate(5px, -10px) skew(-20deg) scale(1.1); filter: sepia(1); }
            100% { transform: translate(0, 0) rotate(360deg) scale(1); }
        }

        .pixel-destruction {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 3000; display: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.1) 2px, rgba(255,255,255,0.1) 4px);
        }

    </style>
</head>
<body class="crt">

<div class="noise-bg"></div>
<div class="hit-overlay" id="flash"></div>
<div class="pixel-destruction" id="pixels"></div>

<svg id="settings-icon" viewBox="0 0 24 24" onclick="toggleSettings()">
    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.81,11.69,4.81,12c0,0.31,0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.5c-1.93,0-3.5-1.57-3.5-3.5 s1.57-3.5,3.5-3.5s3.5,1.57,3.5,3.5S13.93,15.5,12,15.5z"/>
</svg>

<div id="settings-menu">
    <h2 id="settings-title">SETTINGS</h2>
    <button class="lang-btn" onclick="setLang('en')">ENGLISH</button>
    <button class="lang-btn" onclick="setLang('ru')">РУССКИЙ</button>
    <button id="close-btn" class="lang-btn" style="border-color: var(--accent-color); color: var(--accent-color);" onclick="toggleSettings()">CLOSE</button>
</div>

<div class="main-content" id="content">
    <h1 id="title">SYSTEM DESTRUCTION</h1>
    <div class="trash-btn-wrapper">
        <button id="btn">DO NOT TOUCH</button>
    </div>
    <div id="score-container">
        <div id="score">CHAOS: 0</div>
        <div id="combo">COMBO X1</div>
    </div>
    <div id="user-display" style="margin-top: 15px; font-family: var(--mono-font); color: var(--glitch-color); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7;">USER: UNKNOWN</div>
</div>

<nav class="nav-bar">
    <div class="nav-item" id="nav-play" data-text="PLAY">PLAY</div>
    <div class="nav-item" id="nav-quests" data-text="QUESTS">QUESTS</div>
    <div class="nav-item" id="nav-shop" data-text="SHOP">SHOP</div>
    <div class="nav-item" id="nav-rank" data-text="RANK">RANK</div>
</nav>

<script>
    // Initialize Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    // Disable vertical swipes to prevent accidental closing and keep it "expanded"
    tg.isVerticalSwipesEnabled = false;
    
    tg.enableClosingConfirmation();
    
    // Set pure black theme for Telegram
    tg.setHeaderColor('#000000');
    tg.setBackgroundColor('#000000');

    let score = 0;
    let combo = 0;
    let comboTimer;
    let currentLang = 'en';
    let isGlitchActive = false;
    let isPunishing = false;

    const translations = {
        en: {
            title: "SYSTEM DESTRUCTION", btn: "DO NOT TOUCH", score: "CHAOS: ",
            settings: "SETTINGS", close: "CLOSE",
            play: "PLAY", quests: "QUESTS", shop: "SHOP", rank: "RANK",
            trash: ["TRASH DETECTED", "KERNEL PANIC", "CPU MELTING", "DATA LEAK", "GET OUT", "FATAL ERR"],
            glitch: "DANGER!!!", erasing: "WIPING DATA..."
        },
        ru: {
            title: "РАЗРУШЕНИЕ СИСТЕМЫ", btn: "НЕ ТРОГАЙ", score: "ХАОС: ",
            settings: "НАСТРОЙКИ", close: "ЗАКРЬIТЬ",
            play: "ИГРАТЬ", quests: "КВЕСТЫ", shop: "МАГАЗИН", rank: "РЕЙТИНГ",
            trash: ["МУСОР ОБНАРУЖЕН", "ПАНИКА ЯДРА", "ПЛАВЛЕНИЕ ПРОЦЕССОРА", "УТЕЧКА ДАННЫХ", "ВЫХОДИ", "ОШИБКА"],
            glitch: "ОПАСНО!!!", erasing: "УДАЛЕНИЕ..."
        }
    };

    const btn = document.getElementById("btn");
    const scoreEl = document.getElementById("score");
    const comboEl = document.getElementById("combo");
    const flash = document.getElementById("flash");
    const titleEl = document.getElementById("title");
    const settingsMenu = document.getElementById("settings-menu");
    const pixelOverlay = document.getElementById("pixels");

    function toggleSettings() { 
        settingsMenu.classList.toggle("open");
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    }
    
    function setLang(lang) { 
        currentLang = lang; 
        updateUI(); 
        toggleSettings(); 
    }

    function updateUI() {
        const t = translations[currentLang];
        
        // Display Telegram User Info
        const user = tg.initDataUnsafe?.user;
        const userDisplay = document.getElementById("user-display");
        if (user) {
            const name = user.username || user.first_name || "UNKNOWN";
            userDisplay.innerText = "USER: " + name;
        }

        if (!isGlitchActive && !isPunishing) {
            titleEl.innerText = t.title;
            btn.innerText = t.btn;
        }
        if (!isPunishing) scoreEl.innerText = t.score + score;
        
        document.getElementById("settings-title").innerText = t.settings;
        document.getElementById("close-btn").innerText = t.close;
        ["nav-play", "nav-quests", "nav-shop", "nav-rank"].forEach(id => {
            const el = document.getElementById(id);
            const text = t[id.split('-')[1]];
            el.innerText = text; el.setAttribute('data-text', text);
        });
    }

    function spawnDataBlock(color) {
        const b = document.createElement("div");
        b.className = "data-block";
        b.style.left = Math.random() * 100 + "vw";
        b.style.top = Math.random() * 100 + "vh";
        b.style.width = (Math.random() * 100 + 50) + "px";
        b.style.height = (Math.random() * 20 + 5) + "px";
        b.style.backgroundColor = color || (Math.random() > 0.5 ? "var(--glitch-color)" : "var(--accent-color)");
        b.style.zIndex = "4000";
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 150);
    }

    function startGlitchCycle() {
        if (isPunishing) return;
        const nextGlitch = Math.random() * (5000 - 3000) + 3000;
        setTimeout(() => {
            if (isPunishing) return;
            activateGlitch();
            setTimeout(() => {
                deactivateGlitch();
                startGlitchCycle();
            }, 1000);
        }, nextGlitch);
    }

    function activateGlitch() {
        isGlitchActive = true;
        btn.classList.add("glitch-active");
        btn.innerText = translations[currentLang].glitch;
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    }

    function deactivateGlitch() {
        isGlitchActive = false;
        btn.classList.remove("glitch-active");
        if (!isPunishing) btn.innerText = translations[currentLang].btn;
    }

    function triggerPunishment() {
        if (isPunishing) return;
        isPunishing = true;
        isGlitchActive = false;

        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');

        // Эффект стирания баланса
        scoreEl.classList.add("erasing");
        let tempScore = score;
        const eraseInterval = setInterval(() => {
            tempScore = Math.floor(tempScore * 0.7);
            if (tempScore <= 0) {
                tempScore = 0;
                clearInterval(eraseInterval);
            }
            scoreEl.innerText = translations[currentLang].erasing + " " + generateGlitchString(tempScore);
        }, 50);

        function generateGlitchString(val) {
            const chars = "!@#$%^&*()_+-=[]{}|;':,.<>?/";
            let s = val.toString();
            return s.split('').map(c => Math.random() > 0.5 ? chars[Math.floor(Math.random() * chars.length)] : c).join('');
        }

        // Визуальный хаос
        document.body.classList.add("punishment-active");
        pixelOverlay.style.display = "block";
        
        const chaosInterval = setInterval(() => {
            spawnDataBlock("#ff0000");
            spawnDataBlock("#ffffff");
            spawnDataBlock("#0000ff");
        }, 30);

        setTimeout(() => {
            clearInterval(chaosInterval);
            isPunishing = false;
            score = 0;
            combo = 0;
            document.body.classList.remove("punishment-active");
            scoreEl.classList.remove("erasing");
            pixelOverlay.style.display = "none";
            updateUI();
            startGlitchCycle();
        }, 2000);
    }

    const triggerAction = (e) => {
        if (e && e.cancelable) e.preventDefault();
        if (isPunishing) return;
        
        if (isGlitchActive) {
            triggerPunishment();
            return;
        }

        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

        combo++;
        score += combo;
        scoreEl.innerText = translations[currentLang].score + score;
        
        comboEl.style.opacity = "1";
        comboEl.innerText = "COMBO X" + combo;
        
        const scale = Math.min(1 + combo/20, 1.8);
        comboEl.style.transform = `scale(${scale})`;
        
        clearTimeout(comboTimer);
        comboTimer = setTimeout(() => { combo = 0; comboEl.style.opacity = "0"; }, 800);

        flash.classList.remove("flash");
        void flash.offsetWidth;
        flash.classList.add("flash");

        for(let i=0; i<5; i++) spawnDataBlock();

        if(Math.random() > 0.7) {
            const trash = translations[currentLang].trash;
            titleEl.innerText = trash[Math.floor(Math.random() * trash.length)];
            setTimeout(() => {
                if (!isGlitchActive && !isPunishing) titleEl.innerText = translations[currentLang].title;
            }, 350);
        }
    };

    btn.addEventListener('pointerdown', triggerAction);
    
    // Initial UI update
    updateUI();
    startGlitchCycle();
    
    // Let Telegram know we are ready
    tg.ready();
</script>

</body>
</html>
