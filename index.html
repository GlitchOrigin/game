<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLITCH COSMOS - TELEGRAM EDITION</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=JetBrains+Mono:wght@800&display=swap');

        :root {
            --bg-color: #000000;
            --main-font: 'Russo One', sans-serif;
            --mono-font: 'JetBrains Mono', monospace;
            
            /* Cosmic Glitch Palette */
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --neon-purple: #9d00ff;
            --neon-orange: #ffaa00;
            --glitch-white: #ffffff;
            
            --accent-color: var(--neon-pink);
            --glitch-color: var(--neon-blue);
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: var(--main-font);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
            user-select: none; -webkit-user-select: none;
            transition: transform 0.1s;
        }

        /* Star Background */
        .stars-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        .star {
            position: absolute; background: white; border-radius: 50%;
            opacity: 0.5; animation: twinkle var(--duration) infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* CRT Scanlines */
        .crt::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 255, 0, 0.06));
            z-index: 1000; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }

        .noise-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/oEI9uWUznW3D2/giphy.gif');
            opacity: 0.03; pointer-events: none; z-index: 1;
        }

        #settings-icon {
            position: fixed; top: 20px; right: 20px; width: 35px; height: 35px;
            cursor: pointer; z-index: 1100; fill: white; filter: drop-shadow(0 0 5px var(--neon-blue));
        }

        #settings-menu, #rank-menu {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: rgba(10, 0, 20, 0.95);
            padding: 30px; border: 2px solid var(--neon-purple);
            z-index: 1200; transition: 0.2s; text-align: center;
            width: 90%; max-width: 400px;
            clip-path: polygon(0 5%, 100% 0, 100% 95%, 0 100%);
            box-shadow: 0 0 20px var(--neon-purple), 10px 10px 0 var(--neon-blue), -10px -10px 0 var(--neon-pink);
        }
        #settings-menu.open, #rank-menu.open { transform: translate(-50%, -50%) scale(1); animation: menu-glitch 0.3s infinite; }
        
        @keyframes menu-glitch {
            0% { clip-path: polygon(0 5%, 100% 0, 100% 95%, 0 100%); }
            50% { clip-path: polygon(5% 0, 95% 5%, 100% 100%, 0 90%); }
            100% { clip-path: polygon(0 5%, 100% 0, 100% 95%, 0 100%); }
        }

        .lang-btn {
            background: transparent; color: white; border: 2px solid white;
            padding: 15px; font-family: var(--main-font); margin: 10px 0;
            cursor: pointer; font-weight: 900; width: 100%; transition: 0.1s;
        }
        .lang-btn:hover { background: var(--neon-purple); border-color: var(--neon-blue); transform: skew(-5deg); box-shadow: 5px 5px 0 var(--neon-pink); }

        /* Leaderboard Style */
        .rank-list {
            margin: 20px 0; max-height: 300px; overflow-y: auto;
            text-align: left; font-family: var(--mono-font);
        }
        .rank-item {
            display: flex; justify-content: space-between;
            padding: 10px; border-bottom: 1px dashed var(--neon-blue);
            font-size: 0.9rem;
        }
        .rank-item.current-user {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
        }
        .rank-pos { color: var(--neon-pink); margin-right: 10px; }
        .rank-name { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rank-score { color: var(--neon-blue); margin-left: 10px; }

        .main-content { display: flex; flex-direction: column; align-items: center; z-index: 5; margin-top: -5vh; transition: filter 0.1s; }

        h1 {
            font-size: clamp(1.2rem, 8vw, 2.5rem); text-transform: uppercase;
            animation: text-vibrate 0.1s infinite; margin-bottom: 0.5rem;
            text-align: center;
            color: white;
            text-shadow: 3px 3px var(--neon-pink), -3px -3px var(--neon-blue);
        }
        @keyframes text-vibrate {
            0% { transform: translate(0); text-shadow: 2px 2px var(--neon-pink), -2px -2px var(--neon-blue); }
            50% { transform: translate(1px, -1px); text-shadow: -2px -2px var(--neon-pink), 2px 2px var(--neon-blue); }
            100% { transform: translate(0); }
        }

        .trash-btn-wrapper {
            position: relative; width: clamp(200px, 60vw, 280px); height: clamp(200px, 60vw, 280px);
            margin: 1rem 0;
            display: flex; align-items: center; justify-content: center;
        }
        
        /* Circular Glowing Border */
        .btn-glow {
            position: absolute; width: 110%; height: 110%;
            border-radius: 50%;
            border: 4px solid transparent;
            background: linear-gradient(var(--bg-color), var(--bg-color)) padding-box,
                        linear-gradient(45deg, var(--neon-blue), var(--neon-pink), var(--neon-purple), var(--neon-orange)) border-box;
            animation: rotate-glow 4s linear infinite;
            z-index: 1;
        }
        @keyframes rotate-glow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #btn, .extra-btn {
            position: absolute; width: 100%; height: 100%; background: transparent;
            border: none; color: white; font-family: var(--main-font); font-size: 1.3rem;
            font-weight: 900; cursor: pointer; 
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
            text-shadow: 0 0 10px white;
        }
        
        #btn::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.05);
            clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%);
            z-index: -1;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .extra-btn {
            width: 150px; height: 150px;
            font-size: 0.9rem;
            animation: btn-insane 0.5s infinite;
        }
        .extra-btn::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 255, 0.1);
            clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%);
            z-index: -1;
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink);
        }

        #btn.glitch-active {
            color: #000 !important;
            animation: btn-glitch-warning 0.05s infinite !important;
        }
        #btn.glitch-active::after {
            background: #fff !important;
            box-shadow: 0 0 50px #fff, 0 0 20px var(--neon-pink);
        }

        @keyframes btn-glitch-warning {
            0% { transform: translate(5px, 0) skew(10deg); filter: contrast(200%) invert(0); }
            20% { transform: translate(-5px, 2px) skew(-10deg); filter: contrast(150%) invert(1); }
            40% { transform: translate(2px, -5px) scale(1.1); }
            60% { transform: translate(-2px, 5px) rotate(2deg); }
            80% { transform: translate(0, 0) scale(0.9); }
            100% { transform: translate(5px, 0); }
        }

        @keyframes btn-insane {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #score-container { 
            display: flex; flex-direction: column; align-items: center; 
            margin-top: 1rem; width: 100%;
        }
        #score {
            font-size: clamp(1.2rem, 6vw, 2rem); font-family: var(--mono-font);
            color: var(--neon-blue); text-shadow: 0 0 15px var(--neon-blue);
            background: rgba(0, 0, 0, 0.8); padding: 10px 20px; border: 2px solid var(--neon-purple);
            z-index: 10; position: relative; overflow: hidden;
            box-shadow: 0 0 20px rgba(157, 0, 255, 0.3);
        }
        #score.erasing {
            animation: score-shake 0.1s infinite;
            color: #ff0000;
            border-color: #ff0000;
            text-shadow: 0 0 15px #ff0000;
        }
        @keyframes score-shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(0, 0); }
        }

        #combo {
            font-size: 1.2rem; color: var(--neon-pink); font-weight: 900;
            margin-top: 15px;
            opacity: 0; transition: transform 0.1s ease-out, opacity 0.2s;
            text-shadow: 0 0 10px var(--neon-pink);
            pointer-events: none;
        }

        .nav-bar {
            position: fixed; bottom: 25px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: clamp(8px, 2vw, 15px); z-index: 100;
            padding: 0 10px;
        }
        .nav-item {
            font-family: var(--main-font); font-size: clamp(0.6rem, 2.5vw, 0.8rem);
            color: white; text-transform: uppercase; cursor: pointer; position: relative;
            padding: 10px 5px;
            white-space: nowrap;
            transition: 0.2s;
        }
        .nav-item:active {
            color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-blue);
            transform: scale(0.95);
        }

        .data-block { position: absolute; width: 40px; height: 10px; opacity: 0.6; pointer-events: none; z-index: 2; }
        
        .hit-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, rgba(0, 255, 255, 0.2) 0%, rgba(255, 0, 255, 0.1) 50%, rgba(0,0,0,0) 80%);
            pointer-events: none; z-index: 2000; opacity: 0; 
        }
        .flash { animation: flash-anim 0.2s ease-out; }
        @keyframes flash-anim { 0% { opacity: 1; } 100% { opacity: 0; } }

        .punishment-active {
            animation: screen-chaos 0.1s infinite !important;
            filter: hue-rotate(270deg) contrast(300%) !important;
        }

        @keyframes screen-chaos {
            0% { transform: translate(10px, 10px) rotate(2deg) scale(1.1); clip-path: inset(5% 0 35% 0); }
            20% { transform: translate(-10px, -15px) rotate(-2deg) scale(0.9); clip-path: inset(25% 0 15% 0); }
            40% { transform: translate(15px, 5px) skew(15deg) scale(1.3); filter: invert(0.8); }
            60% { transform: translate(-15px, 10px) rotate(90deg) scale(0.7); clip-path: inset(0 15% 0 25%); }
            80% { transform: translate(5px, -5px) skew(-15deg) scale(1.05); filter: sepia(0.5); }
            100% { transform: translate(0, 0) rotate(180deg) scale(1); }
        }

        .pixel-destruction {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 3000; display: none;
            background: url('https://media.giphy.com/media/oEI9uWUznW3D2/giphy.gif');
            opacity: 0.4;
            mix-blend-mode: screen;
            filter: hue-rotate(280deg) saturate(2);
        }

        #decay-timer {
            position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
            font-size: 5rem; color: var(--neon-pink); font-family: var(--mono-font);
            z-index: 3100; display: none; text-shadow: 0 0 20px var(--neon-pink);
            animation: timer-pulse 0.5s infinite;
        }

        .top-shroud {
            position: fixed; top: 0; left: 0; width: 100%; height: 100px;
            background: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0) 100%);
            z-index: 1050; pointer-events: none;
        }

    </style>
</head>
<body class="crt">

<div class="stars-container" id="stars"></div>
<div class="top-shroud"></div>
<div class="noise-bg"></div>
<div class="hit-overlay" id="flash"></div>
<div class="pixel-destruction" id="pixels"></div>
<div id="decay-timer">5.00</div>

<svg id="settings-icon" viewBox="0 0 24 24" onclick="toggleSettings()">
    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.81,11.69,4.81,12c0,0.31,0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.5c-1.93,0-3.5-1.57-3.5-3.5 s1.57-3.5,3.5-3.5s3.5,1.57,3.5,3.5S13.93,15.5,12,15.5z"/>
</svg>

<div id="settings-menu">
    <h2 id="settings-title">SETTINGS</h2>
    <button class="lang-btn" onclick="setLang('en')">ENGLISH</button>
    <button class="lang-btn" onclick="setLang('ru')">РУССКИЙ</button>
    <button id="close-btn" class="lang-btn" style="border-color: var(--neon-pink); color: var(--neon-pink);" onclick="toggleSettings()">CLOSE</button>
</div>

<div id="rank-menu">
    <h2 id="rank-title">TOP CHAOS</h2>
    <div class="rank-list" id="rank-list">
        <div class="rank-item">LOADING...</div>
    </div>
    <button class="lang-btn" style="border-color: var(--neon-pink); color: var(--neon-pink);" onclick="toggleRank()">CLOSE</button>
</div>

<div class="main-content" id="content">
    <h1 id="title">GLITCH COSMOS</h1>
    <div class="trash-btn-wrapper" id="btn-container">
        <div class="btn-glow"></div>
        <button id="btn">ENGAGE CORE</button>
    </div>
    <div id="score-container">
        <div id="score">CHAOS: 0</div>
        <div id="combo">COMBO X1</div>
    </div>
    <div id="user-display" style="margin-top: 15px; font-family: var(--mono-font); color: var(--neon-blue); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7; text-shadow: 0 0 5px var(--neon-blue);">USER: UNKNOWN</div>
</div>

<nav class="nav-bar">
    <div class="nav-item" id="nav-play" data-text="PLAY">PLAY</div>
    <div class="nav-item" id="nav-quests" data-text="QUESTS">QUESTS</div>
    <div class="nav-item" id="nav-shop" data-text="SHOP">SHOP</div>
    <div class="nav-item" id="nav-rank" data-text="RANK">RANK</div>
    <div class="nav-item" id="nav-ads" data-text="ADS">ADS</div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDat3B7qhTuYy0f8m2X2fhHjq25rnfOyOs",
        authDomain: "glitch-5c987.firebaseapp.com",
        databaseURL: "https://glitch-5c987-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "glitch-5c987",
        storageBucket: "glitch-5c987.firebasestorage.app",
        messagingSenderId: "50137631153",
        appId: "1:50137631153:web:ed78f4b882c93b9ad55590",
        measurementId: "G-0RR49FNPYT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.isVerticalSwipesEnabled = false;
    tg.enableClosingConfirmation();
    tg.setHeaderColor('#000000');
    tg.setBackgroundColor('#000000');

    const AdController = window.Adsgram.init({ blockId: "34799", debug: true });

    // Create Stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 150; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
        
        // Random star colors from palette
        const colors = ['#ffffff', '#00ffff', '#ff00ff', '#ffaa00'];
        star.style.background = colors[Math.floor(Math.random() * colors.length)];
        star.style.boxShadow = `0 0 ${size*2}px ${star.style.background}`;
        
        starsContainer.appendChild(star);
    }

    // State
    let score = 0;
    let currentLang = 'en';
    let combo = 0;
    let comboTimer;
    let isGlitchActive = false;
    let isPunishing = false;
    let userId = "guest";
    let userName = "Unknown User";
    
    // New Mechanics State
    let isTripleActive = false;
    let buttonsToClick = 0;
    let isDecayActive = false;
    let decayTimeLeft = 5.0;
    let decayInterval;

    const translations = {
        en: {
            title: "GLITCH COSMOS",
            btn: "ENGAGE CORE",
            score: "CHAOS: ",
            erasing: "CORRUPTING...",
            settings: "SETTINGS",
            rank: "TOP CHAOS",
            triple: "SYNC ALL!",
            decay: "STABILIZE!",
            trash: ["NEBULA ERROR", "STAR BREACH", "VOID ACCESS", "PULSAR FAILURE", "OVERLOAD"]
        },
        ru: {
            title: "ГЛИТЧ КОСМОС",
            btn: "ЗАПУСК ЯДРА",
            score: "ХАОС: ",
            erasing: "ИСКАЖЕНИЕ...",
            settings: "НАСТРОЙКИ",
            rank: "ТОП ХАОСА",
            triple: "СИНХРОНИЗАЦИЯ!",
            decay: "СТАБИЛИЗАЦИЯ!",
            trash: ["ОШИБКА ТУМАННОСТИ", "РАЗРЫВ ЗВЕЗДЫ", "ПУСТОТА", "СБОЙ ПУЛЬСАРА", "ПЕРЕГРУЗКА"]
        }
    };

    const btn = document.getElementById("btn");
    const btnContainer = document.getElementById("btn-container");
    const scoreEl = document.getElementById("score");
    const comboEl = document.getElementById("combo");
    const titleEl = document.getElementById("title");
    const settingsMenu = document.getElementById("settings-menu");
    const rankMenu = document.getElementById("rank-menu");
    const flash = document.getElementById("flash");
    const pixelOverlay = document.getElementById("pixels");
    const decayTimerEl = document.getElementById("decay-timer");

    // Firebase logic
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        userId = tg.initDataUnsafe.user.id.toString();
        userName = tg.initDataUnsafe.user.first_name || "User" + userId.slice(-4);
        document.getElementById("user-display").innerText = "USER: " + userName;
    }

    function saveToFirebase() {
        if (userId === "guest") return;
        set(ref(db, 'users/' + userId), {
            name: userName,
            score: score,
            lastUpdate: Date.now()
        });
    }

    const userScoreRef = ref(db, 'users/' + userId + '/score');
    onValue(userScoreRef, (snapshot) => {
        const data = snapshot.val();
        if (data !== null && data > score) {
            score = data;
            updateUI();
        }
    });

    function updateUI() {
        scoreEl.innerText = translations[currentLang].score + score;
        titleEl.innerText = isDecayActive ? translations[currentLang].decay : (isTripleActive ? translations[currentLang].triple : translations[currentLang].title);
        btn.innerText = isDecayActive ? translations[currentLang].decay : (isTripleActive ? translations[currentLang].triple : translations[currentLang].btn);
    }

    window.setLang = (lang) => {
        currentLang = lang;
        updateUI();
        document.getElementById("settings-title").innerText = translations[lang].settings;
        document.getElementById("rank-title").innerText = translations[lang].rank;
        document.getElementById("close-btn").innerText = lang === 'ru' ? 'ЗАКРЫТЬ' : 'CLOSE';
        toggleSettings();
    };

    window.toggleSettings = () => settingsMenu.classList.toggle("open");
    window.toggleRank = () => {
        rankMenu.classList.toggle("open");
        if (rankMenu.classList.contains("open")) loadLeaderboard();
    };

    function loadLeaderboard() {
        const topUsersQuery = query(ref(db, 'users'), orderByChild('score'), limitToLast(10));
        onValue(topUsersQuery, (snapshot) => {
            const data = snapshot.val();
            const listEl = document.getElementById("rank-list");
            listEl.innerHTML = "";
            if (data) {
                const sorted = Object.entries(data).sort((a, b) => b[1].score - a[1].score);
                sorted.forEach(([id, user], index) => {
                    const item = document.createElement("div");
                    item.className = "rank-item" + (id === userId ? " current-user" : "");
                    item.innerHTML = `<span class="rank-pos">#${index + 1}</span><span class="rank-name">${user.name}</span><span class="rank-score">${user.score}</span>`;
                    listEl.appendChild(item);
                });
            }
        });
    }

    function spawnDataBlock(color) {
        const block = document.createElement("div");
        block.className = "data-block";
        block.style.left = Math.random() * 100 + "vw";
        block.style.top = Math.random() * 100 + "vh";
        block.style.backgroundColor = color || (Math.random() > 0.5 ? "var(--neon-blue)" : "var(--neon-pink)");
        block.style.boxShadow = `0 0 10px ${block.style.backgroundColor}`;
        document.body.appendChild(block);
        setTimeout(() => block.remove(), 500);
    }

    function startGlitchCycle() {
        const delay = Math.random() * 5000 + 3000;
        setTimeout(() => {
            if (isPunishing || isDecayActive || isTripleActive) {
                startGlitchCycle();
                return;
            }
            
            const rand = Math.random();
            if (rand < 0.4) {
                activateGlitch();
            } else if (rand < 0.7) {
                startTripleEvent();
            } else {
                startDecayEvent();
            }
        }, delay);
    }

    function activateGlitch() {
        isGlitchActive = true;
        btn.classList.add("glitch-active");
        btn.innerText = "!!! VOID !!!";
        setTimeout(deactivateGlitch, Math.random() * 1500 + 500);
    }

    function deactivateGlitch() {
        isGlitchActive = false;
        btn.classList.remove("glitch-active");
        if (!isPunishing && !isDecayActive && !isTripleActive) {
            btn.innerText = translations[currentLang].btn;
            startGlitchCycle();
        }
    }

    function startTripleEvent() {
        isTripleActive = true;
        buttonsToClick = 3;
        updateUI();

        for (let i = 0; i < 2; i++) {
            const extra = document.createElement("button");
            extra.className = "extra-btn";
            extra.innerText = translations[currentLang].triple;
            
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 150);
            extra.style.left = x + "px";
            extra.style.top = y + "px";
            
            extra.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                extra.remove();
                buttonsToClick--;
                checkTripleComplete();
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            });
            document.body.appendChild(extra);
        }
    }

    function checkTripleComplete() {
        if (buttonsToClick === 0) {
            isTripleActive = false;
            updateUI();
            startGlitchCycle();
        }
    }

    function startDecayEvent() {
        isDecayActive = true;
        decayTimeLeft = 5.0;
        pixelOverlay.style.display = "block";
        decayTimerEl.style.display = "block";
        updateUI();

        decayInterval = setInterval(() => {
            decayTimeLeft -= 0.05;
            decayTimerEl.innerText = decayTimeLeft.toFixed(2);
            pixelOverlay.style.opacity = (1 - decayTimeLeft / 5) * 0.8 + 0.2;
            
            if (decayTimeLeft <= 0) {
                clearInterval(decayInterval);
                failDecay();
            }
        }, 50);
    }

    function failDecay() {
        isDecayActive = false;
        decayTimerEl.style.display = "none";
        pixelOverlay.style.display = "none";
        
        const penalty = Math.floor(score * 0.3);
        score -= penalty;
        if (score < 0) score = 0;
        
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        tg.showAlert("SYSTEM CORRUPTED! -30% CHAOS");
        
        saveToFirebase();
        updateUI();
        startGlitchCycle();
    }

    function fixDecay() {
        clearInterval(decayInterval);
        isDecayActive = false;
        decayTimerEl.style.display = "none";
        pixelOverlay.style.display = "none";
        
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        
        score += 50;
        saveToFirebase();
        updateUI();
        startGlitchCycle();
    }

    function triggerPunishment() {
        if (isPunishing) return;
        isPunishing = true;
        isGlitchActive = false;
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');

        scoreEl.classList.add("erasing");
        let tempScore = score;
        const eraseInterval = setInterval(() => {
            tempScore = Math.floor(tempScore * 0.7);
            if (tempScore <= 0) {
                tempScore = 0;
                clearInterval(eraseInterval);
            }
            scoreEl.innerText = translations[currentLang].erasing + " " + generateGlitchString(tempScore);
        }, 50);

        function generateGlitchString(val) {
            const chars = "!@#$%^&*()_+-=[]{}|;':,.<>?/";
            let s = val.toString();
            return s.split('').map(c => Math.random() > 0.5 ? chars[Math.floor(Math.random() * chars.length)] : c).join('');
        }

        document.body.classList.add("punishment-active");
        pixelOverlay.style.display = "block";
        pixelOverlay.style.opacity = "0.5";
        
        const chaosInterval = setInterval(() => {
            spawnDataBlock("#ff00ff");
            spawnDataBlock("#00ffff");
            spawnDataBlock("#ffaa00");
        }, 30);

        setTimeout(() => {
            clearInterval(chaosInterval);
            isPunishing = false;
            score = 0;
            combo = 0;
            saveToFirebase();
            document.body.classList.remove("punishment-active");
            scoreEl.classList.remove("erasing");
            pixelOverlay.style.display = "none";
            updateUI();
            startGlitchCycle();
        }, 2000);
    }

    const triggerAction = (e) => {
        if (e && e.cancelable) e.preventDefault();
        if (isPunishing) return;
        
        if (isDecayActive) {
            fixDecay();
            return;
        }

        if (isTripleActive) {
            buttonsToClick--;
            checkTripleComplete();
            score += 1;
            updateUI();
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            return;
        }

        if (isGlitchActive) {
            triggerPunishment();
            return;
        }

        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

        combo++;
        score += combo;
        saveToFirebase();
        scoreEl.innerText = translations[currentLang].score + score;
        
        comboEl.style.opacity = "1";
        comboEl.innerText = "COMBO X" + combo;
        const scale = Math.min(1 + combo/20, 1.8);
        comboEl.style.transform = `scale(${scale})`;
        
        clearTimeout(comboTimer);
        comboTimer = setTimeout(() => { combo = 0; comboEl.style.opacity = "0"; }, 800);

        flash.classList.remove("flash");
        void flash.offsetWidth;
        flash.classList.add("flash");
        for(let i=0; i<5; i++) spawnDataBlock();

        if(Math.random() > 0.7) {
            const trash = translations[currentLang].trash;
            titleEl.innerText = trash[Math.floor(Math.random() * trash.length)];
            setTimeout(() => {
                if (!isGlitchActive && !isPunishing && !isDecayActive && !isTripleActive) titleEl.innerText = translations[currentLang].title;
            }, 350);
        }
    };

    btn.addEventListener('pointerdown', triggerAction);

    const navItems = {
        'nav-play': () => { 
            rankMenu.classList.remove("open");
            settingsMenu.classList.remove("open");
        },
        'nav-quests': () => { tg.showAlert('Coming Soon...'); },
        'nav-shop': () => { tg.showAlert('Coming Soon...'); },
        'nav-rank': () => { toggleRank(); },
        'nav-ads': () => {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            AdController.show().then((result) => {
                score += 1000;
                saveToFirebase();
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert('REWARD: +1000 CHAOS');
            }).catch((result) => {
                console.error('Ads error:', result);
                tg.showAlert('Ads error: ' + (result.error || 'Unknown error'));
            });
        }
    };

    Object.keys(navItems).forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('pointerdown', (e) => {
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                navItems[id]();
            });
        }
    });
    
    updateUI();
    startGlitchCycle();
    tg.ready();
</script>

</body>
</html>
